name: Build images

on:
  workflow_dispatch:
  push:
    branches: [ next ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: next

      - name: Dump repo tree
        run: |
          echo "=== ROOT ==="
          ls -la
          echo
          echo "=== TOP-LEVEL FILES ==="
          find . -maxdepth 1 -type f
          echo
          echo "=== DIRECTORIES ==="
          find . -maxdepth 1 -type d
          echo
          echo "=== MAKEFILES ==="
          find . -name Makefile
          echo
          echo "=== BUILD SCRIPTS ==="
          find . -name "*.sh"
